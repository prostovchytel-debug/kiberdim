function reset(msg){active=false;clearPointer();pos=home;trail=[home];paint();status(msg)}
function arrived(){active=false;running=false;pos=cheese;score=1;paint();finish();status('Мишка дісталася сиру!')}
function runPath(){active=false;clearPointer();running=true;pos=home;let i=1,last=0;function tick(t){let budget=Math.min(30,(t-(last||t))*0.42);last=t;while(i<trail.length&&budget>0){const p=trail[i],d=dist(pos,p);if(d<=budget){budget-=d;pos=p;i++}else{pos={x:pos.x+(p.x-pos.x)*budget/d,y:pos.y+(p.y-pos.y)*budget/d};budget=0}}paint();if(i<trail.length)frame=requestAnimationFrame(tick);else arrived()}frame=requestAnimationFrame(tick)}
function move(p){if(!active||running||complete)return;const n=Math.max(1,Math.ceil(dist(pos,p)/4));for(let i=1;i<=n;i++){const q={x:pos.x+(p.x-pos.x)*i/n,y:pos.y+(p.y-pos.y)*i/n};if(!edges.some(([a,b])=>near(q,a,b)<=rad-5))return reset('Торкнулися стіни. Почни знову від мишки.')}pos=p;if(drawMode)trail.push(p);paint();if(dist(pos,cheese)<20&&!drawMode)arrived()}
function point(e){let r=c.getBoundingClientRect();return{x:(e.clientX-r.left)*c.width/r.width,y:(e.clientY-r.top)*c.height/r.height}}
c.onpointerdown=e=>{if(e.button!==0||running||complete)return;const p=point(e);if(dist(p,home)>rad){if(!active)status('Почни з мишки у верхньому лівому куті.');return}active=true;pos=home;trail=[home];pid=e.pointerId;if(drawMode||e.pointerType!=='mouse')c.setPointerCapture(pid);status(drawMode?'Тримай кнопку та малюй до сиру.':'Веди мишку світлою стежкою.')};c.onpointermove=e=>{if(pid===e.pointerId)move(point(e))};c.onpointerup=e=>{if(!active||e.pointerId!==pid)return;if(drawMode){move(point(e));if(active){if(dist(pos,cheese)<22)runPath();else reset('Відпусти кнопку біля сиру. Спробуй ще!')}}else if(e.pointerType!=='mouse')reset('Спробуй провести мишку одним дотиком.')};c.onpointerleave=()=>{if(active&&!drawMode)reset('Повернися до мишки й почни ще раз.')};c.onpointercancel=()=>{if(active)reset('Почни ще раз від мишки.')};
c.onkeydown=e=>{const d={ArrowLeft:[-8,0],ArrowRight:[8,0],ArrowUp:[0,-8],ArrowDown:[0,8]}[e.key];if(!d||complete||running)return;e.preventDefault();active=true;move({x:pos.x+d[0],y:pos.y+d[1]});if(drawMode&&active&&dist(pos,cheese)<20)runPath()};mazeClean=()=>{active=false;clearPointer();cancelAnimationFrame(frame)};paint()}
stations.forEach((s,i)=>{const b=button('','',()=>start(i,0),document.querySelector('nav'));b.innerHTML='<span aria-hidden="true">'+icons[i]+'</span>'+s});$('level').onchange=e=>start(block,+e.target.value);$('restart').onclick=()=>$('confirmBox').showModal();$('stay').onclick=()=>$('confirmBox').close();$('again').onclick=()=>{$('confirmBox').close();start(block,round)};start(0,0);
</script></html>
